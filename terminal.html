<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alfie Radcliffe — Terminal</title>
<meta name="description" content="Explore Alfie Radcliffe's portfolio from a shell: ls, cat, man alfie, neofetch.">
<link rel="icon" type="image/png" href="assets/alfie-head.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="theme.css">
<script src="sprite.js"></script>
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }

  /* ---------- Top strip ---------- */
  .menubar { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 5; display: flex; align-items: center; gap: 16px;
    padding: 0 20px 0 92px; background: rgba(253,251,243,.94); border-bottom: 2.5px dashed var(--ink); }
  .menubar .logo { display: flex; align-items: center; gap: 8px; font: 400 20px var(--scrawl); }
  .menubar img { width: 38px; height: 33px; filter: url(#alfie-boil); }
  .menubar .sp { flex: 1; }
  .menubar .btn { font-size: 20px; padding: 3px 12px 4px; }
  .menubar .clock { font: 18px var(--type); color: var(--pencil); }

  /* ---------- Desktop icons (sticky notes) ---------- */
  .icons { position: fixed; top: 86px; left: 92px; display: grid; gap: 22px; z-index: 2; }
  .icon { width: 96px; padding: 12px 6px 8px; display: grid; justify-items: center; gap: 2px; cursor: pointer; border: 0; color: var(--ink);
    font: 700 21px/1 var(--hand); text-align: center; }
  .icon .pic { font: 400 26px var(--scrawl); line-height: 1.1; }
  .icon:nth-child(odd) { transform: rotate(-3deg); } .icon:nth-child(even) { transform: rotate(2deg); }
  .icon:hover { transform: rotate(0) scale(1.08); }
  @media (max-width: 1180px) { .icons { display: none; } }

  /* ---------- Terminal: a sheet of lined paper ---------- */
  .win { position: fixed; z-index: 3; top: 86px; bottom: 46px; left: 50%; width: min(860px, calc(100vw - 40px));
    transform: translateX(-50%) rotate(-.4deg); display: flex; flex-direction: column; padding: 18px 22px 30px; }
  .win .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2.5px solid var(--ink); padding-bottom: 6px; }
  .win .head .t { font: 700 28px var(--hand); }
  .win .head .sub { font: 20px var(--note); color: var(--pencil); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 2px; }
  .chips button { font: 700 19px/1.2 var(--hand); background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: var(--wobbly); padding: 1px 10px; cursor: pointer; }
  .chips button:nth-child(odd) { border-radius: var(--wobbly-2); }
  .chips button:hover { background: var(--hl-yellow); transform: rotate(-2deg); }

  #term { flex: 1; overflow-y: auto; padding: 10px 2px 20px; cursor: text; font: 17px/32px var(--type); color: var(--ink); }
  #out > div { white-space: pre-wrap; word-break: break-word; min-height: 32px; }
  .line { display: flex; flex-wrap: wrap; }
  .prompt { color: #1f8a4c; white-space: pre; }
  .prompt b { color: var(--pen-blue); font-weight: 400; }
  #in { flex: 1; min-width: 120px; background: none; border: 0; outline: 0; color: var(--ink); font: inherit; caret-color: var(--pen-red); }
  .dir { color: var(--pen-blue); text-decoration: underline 2px; } .pdf { color: var(--pen-red); } .hid { color: var(--pencil); }
  .b { font-weight: 700; } .d { color: var(--pencil); } .r { color: var(--pen-red); } .g { color: #1f8a4c; } .u { color: var(--pen-blue); } .y { background: var(--hl-yellow); }
  .fetch { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; white-space: normal !important; padding: 8px 0; }
  .fetch pre { font: inherit; }

  /* ---------- Doodles + Alfie standing on a scribbled ground ---------- */
  #buddy { position: fixed; z-index: 4; right: max(14px, calc(50% - 430px - 220px)); bottom: 26px; }
  .ground { position: fixed; bottom: 20px; right: max(0px, calc(50% - 430px - 250px)); width: 260px; height: 24px; z-index: 1; }
  @media (max-width: 1180px) { #buddy, .ground { display: none; } }
  @media (max-width: 720px) {
    #term { font-size: 15px; }
    .win { top: 70px; bottom: 16px; width: calc(100vw - 44px); left: calc(50% + 10px); padding: 14px 14px 26px; }
    .menubar { padding-left: 34px; }
    .menubar .btn { font-size: 17px; white-space: nowrap; }
    .menubar .hide-sm { display: none; }
  }
</style>
</head>
<body>
  <svg class="doodle" style="top:76px;right:4%;position:fixed" width="96" height="96" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="24"/><path d="M60 12 L60 28 M60 92 L60 108 M12 60 L28 60 M92 60 L108 60 M26 26 L37 37 M83 83 L94 94 M94 26 L83 37 M26 94 L37 83"/></svg>
  <svg class="doodle ground" viewBox="0 0 260 24" preserveAspectRatio="none" aria-hidden="true"><path d="M4 14 Q60 8 130 14 T256 13 M30 20 L42 16 M200 20 L212 15"/></svg>

  <div class="menubar">
    <span class="logo"><img src="assets/alfie-head.png" alt="">AlfieOS</span>
    <span class="sp"></span>
    <a class="btn yellow" href="index.html">← recruiter mode</a>
    <span class="hide-sm clock" id="clock"></span>
  </div>

  <div class="icons" aria-label="Desktop shortcuts">
    <button class="icon sticky" data-cmd="cat about.txt"><span class="pic">✎</span>about.txt</button>
    <button class="icon sticky blue" data-cmd="ls ~/projects"><span class="pic">▤</span>projects</button>
    <button class="icon sticky pink" data-cmd="open cv.pdf"><span class="pic">CV</span>cv.pdf</button>
    <button class="icon sticky green" data-cmd="man alfie"><span class="pic">?</span>man alfie</button>
    <button class="icon sticky" data-cmd="sudo hire alfie"><span class="pic">★</span>hire.sh</button>
  </div>

  <section class="win sheet lined taped" aria-label="Terminal">
    <div class="head"><span class="t">alfie@alfieos: ~</span><span class="sub">alfsh — type a command, or tap one below</span></div>
    <div class="chips" aria-label="Suggested commands">
      <button>help</button><button>ls ~/projects</button><button>cat about.txt</button>
      <button>man alfie</button><button>neofetch</button><button>ping</button><button>open cv.pdf</button>
    </div>
    <main id="term" aria-live="polite">
      <div id="out"></div>
      <div class="line"><span class="prompt" id="ps"></span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input" autofocus></div>
    </main>
  </section>

  <div id="buddy" data-alfie data-alfie-scale="11" data-alfie-left data-alfie-say="type help!"></div>

  <script src="projects.js"></script>
  <script src="terminal.js"></script>
  <script>
    const clock = document.getElementById("clock");
    const tick = () => (clock.textContent = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }));
    tick(); setInterval(tick, 10000);
  </script>
</body>
</html>
