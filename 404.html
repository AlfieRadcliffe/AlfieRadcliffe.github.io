<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Alfie Radcliffe</title>

<link rel="stylesheet" href="/theme.css">

<style>
  body { display: grid; place-items: center; padding: 30px 16px 40px; }
  .box { display: grid; justify-items: center; gap: 14px; text-align: center; }
  .me { padding-right: 190px; }
  h1 { font: 400 clamp(70px, 14vw, 130px)/1 var(--scrawl); color: var(--pen-red); transform: rotate(-4deg); }
  .err { font: 18px var(--type); }
  .err s { text-decoration: line-through 2.5px var(--pen-red); color: var(--pencil); }
  .note { font: 24px var(--note); color: var(--pencil); }
  @media (max-width: 520px) { .me { padding-right: 120px; } }
</style>
</head>
<body>
  <div class="box">
    <div class="me" data-alfie data-alfie-scale="11" data-alfie-face="think" data-alfie-say="uh oh… where did that page go?"></div>
    <h1>404</h1>
    <div class="err"><s>page found</s> Segmentation fault (core dumped)</div>
    <p class="note">this page doesn't exist, or I scribbled it out</p>
    <div class="btns" style="justify-content:center">
      <a class="btn yellow" href="/">back to the portfolio</a>
      <a class="btn" href="/terminal.html">&gt;_ open terminal</a>
    </div>
  </div>
